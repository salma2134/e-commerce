<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>Inscription</title>
</h:head>

<h:body>

    <h2>Inscription</h2>

    <h:form>

        Nom :
        <h:inputText value="#{internauteBean.internaute.nom}" />
        <br/>

        Prénom :
        <h:inputText value="#{internauteBean.internaute.prenom}" />
        <br/>

        Email :
        <h:inputText value="#{internauteBean.internaute.email}" />
        <br/>

        Mot de passe :
        <h:inputSecret value="#{internauteBean.internaute.motDePasse}" />
        <br/>

        <h:commandButton value="S'inscrire"
                         action="#{internauteBean.inscrire}" />

    </h:form>

</h:body>
</html>
