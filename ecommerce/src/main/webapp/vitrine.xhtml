<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Vitrine</title>
</h:head>

<h:body>

    <h2>Nos produits</h2>

    <h:form>

        <h:dataTable value="#{vitrineBean.produits}" var="p" border="1">

            <h:column>
                <f:facet name="header">Nom</f:facet>
                #{p.nom}
            </h:column>

            <h:column>
                <f:facet name="header">Description</f:facet>
                #{p.description}
            </h:column>

            <h:column>
                <f:facet name="header">Prix</f:facet>
                #{p.prix} DH
            </h:column>

            <h:column>
                <h:commandButton value="Ajouter au panier"
                                 action="#{panierBean.ajouter(p)}" />
            </h:column>

        </h:dataTable>

        <br/>

        <h:link value="Voir mon panier" outcome="panier" />

        |

        <h:commandLink value="Déconnexion"
                       action="#{internauteBean.deconnecter}" />

    </h:form>

</h:body>
</html>
