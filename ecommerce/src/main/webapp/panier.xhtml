<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Mon panier</title>
</h:head>

<h:body>

    <h2>Mon panier</h2>

    <h:form>

        <h:dataTable value="#{panierBean.panier.lignes}" var="l" border="1">

            <h:column>
                <f:facet name="header">Produit</f:facet>
                #{l.produit.nom}
            </h:column>

            <h:column>
                <f:facet name="header">Prix</f:facet>
                #{l.produit.prix} DH
            </h:column>

            <h:column>
                <f:facet name="header">Quantité</f:facet>
                #{l.quantite}
            </h:column>

            <h:column>
                <f:facet name="header">Sous-total</f:facet>
                #{l.sousTotal} DH
            </h:column>

            <h:column>
                <h:commandButton value="Retirer"
                                 action="#{panierBean.retirer(l)}" />
            </h:column>

        </h:dataTable>

        <h3>Total : #{panierBean.panier.total} DH</h3>

        <h:link value="Retour à la vitrine" outcome="vitrine" />

    </h:form>

</h:body>
</html>
